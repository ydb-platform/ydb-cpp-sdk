name: SLO

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

jobs:
  sdk-cache:
    if: contains(github.event.pull_request.labels.*.name, 'SLO')

    name: Cache SLO SDK (${{ matrix.sdk.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        sdk:
          - name: native
            preset: release-test-clang
            dockerfile: tests/slo_workloads/Dockerfile
            cache_scope: slo-sdk
            legacy_cache_scope: slo
          - name: userver
            preset: release-test-clang
            dockerfile: tests/slo_workloads/Dockerfile.userver
            cache_scope: slo-userver-sdk
            legacy_cache_scope: slo-userver

    steps:
      - name: Checkout current SDK version
        uses: actions/checkout@v5
        with:
          path: sdk-current
          fetch-depth: 1

      - name: Stage Docker ignore rules
        run: cp sdk-current/tests/slo_workloads/.dockerignore sdk-current/.dockerignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.30.1

      - name: Restore SDK ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ${{ matrix.sdk.legacy_cache_scope }}-ccache-${{ matrix.sdk.preset }}-sdk-${{ github.run_id }}
          restore-keys: |
            ${{ matrix.sdk.legacy_cache_scope }}-ccache-${{ matrix.sdk.preset }}-sdk-
            ${{ matrix.sdk.legacy_cache_scope }}-ccache-${{ matrix.sdk.preset }}-

      - name: Inject ccache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3.1.2
        with:
          cache-map: |
            {
              "ccache": "/root/.ccache"
            }
          skip-extraction: false

      # Export the installed SDK before compiling a workload. Topic and
      # key-value then share this layer, and a harness compile failure cannot
      # discard an hour of SDK build work.
      - name: Build and cache installed SDK
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: sdk-current
          file: sdk-current/${{ matrix.sdk.dockerfile }}
          target: sdk
          platforms: linux/amd64
          cache-from: |
            type=gha,scope=${{ matrix.sdk.cache_scope }}-${{ matrix.sdk.preset }}
            type=gha,scope=${{ matrix.sdk.legacy_cache_scope }}-${{ matrix.sdk.preset }}
          cache-to: type=gha,mode=max,scope=${{ matrix.sdk.cache_scope }}-${{ matrix.sdk.preset }}

  ydb-slo-action:
    if: contains(github.event.pull_request.labels.*.name, 'SLO')
    needs: sdk-cache

    name: Run YDB SLO Tests (${{ matrix.sdk.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        sdk:
          - name: cpp-key-value
            preset: release-test-clang
            dockerfile: tests/slo_workloads/Dockerfile
            cache_scope: slo-key-value
            sdk_cache_scope: slo-sdk
            ccache_scope: slo
            target: slo-key-value
            binary: tests/slo_workloads/key_value/slo-key-value
            command: "--read-rps 1000 --write-rps 100"
          - name: cpp-key-value-userver
            preset: release-test-clang
            dockerfile: tests/slo_workloads/Dockerfile.userver
            cache_scope: slo-userver-key-value
            sdk_cache_scope: slo-userver-sdk
            ccache_scope: slo-userver
            target: slo-userver-key-value
            binary: tests/slo_workloads/userver/key_value/slo-userver-key-value
            command: "--read-rps 1000 --write-rps 100"
          - name: cpp-topic
            preset: release-test-clang
            dockerfile: tests/slo_workloads/Dockerfile
            cache_scope: slo-topic
            sdk_cache_scope: slo-sdk
            ccache_scope: slo
            target: slo-topic
            binary: tests/slo_workloads/topic/slo-topic
            command: "--writer-count 20 --reader-count 5"
            metrics_yaml_path: sdk-current/tests/slo_workloads/metrics-topic.yaml
          - name: cpp-topic-userver
            preset: release-test-clang
            dockerfile: tests/slo_workloads/Dockerfile.userver
            cache_scope: slo-userver-topic
            sdk_cache_scope: slo-userver-sdk
            ccache_scope: slo-userver
            target: slo-userver-topic
            binary: tests/slo_workloads/userver/topic/slo-userver-topic
            command: "--writer-count 20 --reader-count 5"
            metrics_yaml_path: sdk-current/tests/slo_workloads/metrics-topic.yaml

    concurrency:
      group: slo-${{ github.ref }}-${{ matrix.sdk.name }}
      cancel-in-progress: true

    steps:
      - name: Install dependencies
        run: |
          set -euxo pipefail
          YQ_VERSION=v4.48.2
          BUILDX_VERSION=0.30.1
          COMPOSE_VERSION=2.40.3

          sudo curl -fLo /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

          sudo mkdir -p /usr/local/lib/docker/cli-plugins

          sudo curl -fLo /usr/local/lib/docker/cli-plugins/docker-buildx \
            "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64"
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx

          sudo curl -fLo /usr/local/lib/docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          yq --version
          docker --version
          docker buildx version
          docker compose version

      - name: Checkout current SDK version
        uses: actions/checkout@v5
        with:
          path: sdk-current
          fetch-depth: 0

      - name: Determine baseline commit
        id: baseline
        working-directory: sdk-current
        run: |
          set -euo pipefail
          BASELINE=$(git merge-base HEAD origin/main)
          echo "sha=${BASELINE}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "${BASELINE}" origin/main && \
             [ "$(git rev-parse origin/main)" = "${BASELINE}" ]; then
            BASELINE_REF="main"
          else
            BRANCH=$(git branch -r --contains "${BASELINE}" | grep -v HEAD | head -1 | sed 's|.*/||' || echo "")
            if [ -n "${BRANCH}" ]; then
              BASELINE_REF="${BRANCH}@${BASELINE:0:7}"
            else
              BASELINE_REF="${BASELINE:0:7}"
            fi
          fi
          echo "ref=${BASELINE_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout baseline SDK version
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: sdk-baseline
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Use current's workload harness (Dockerfile, sources, .dockerignore) for
      # both builds so only the SDK library differs between current and
      # baseline. Without this the baseline image picks up the harness from
      # the merge-base commit, which can lag behind the action's contract.
      # buildx also expects .dockerignore at the context root, not under
      # tests/, so copy it up in each checkout.
      - name: Stage workload harness
        run: |
          set -euxo pipefail
          rm -rf sdk-baseline/tests/slo_workloads
          cp -a sdk-current/tests/slo_workloads sdk-baseline/tests/slo_workloads
          cp sdk-current/tests/slo_workloads/.dockerignore sdk-current/.dockerignore
          cp sdk-baseline/tests/slo_workloads/.dockerignore sdk-baseline/.dockerignore

      # `cache-to: type=gha` does NOT export `--mount=type=cache` content, so
      # ccache state is lost between runs. Persist /root/.ccache via host
      # directory + cache-dance: actions/cache restores the host dir, the
      # dance injects it into the BuildKit cache mount before the build and
      # extracts the updated state afterwards for the next save.
      - name: Restore ccache
        id: ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ${{ matrix.sdk.cache_scope }}-ccache-${{ matrix.sdk.preset }}-${{ github.run_id }}
          restore-keys: |
            ${{ matrix.sdk.cache_scope }}-ccache-${{ matrix.sdk.preset }}-
            ${{ matrix.sdk.ccache_scope }}-ccache-${{ matrix.sdk.preset }}-

      - name: Inject ccache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3.1.2
        with:
          cache-map: |
            {
              "ccache": "/root/.ccache"
            }
          skip-extraction: false

      - name: Build current workload image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: sdk-current
          file: sdk-current/${{ matrix.sdk.dockerfile }}
          platforms: linux/amd64
          tags: ydb-app-current
          load: true
          build-args: |
            SLO_TARGET=${{ matrix.sdk.target }}
            SLO_BINARY=${{ matrix.sdk.binary }}
          cache-from: |
            type=gha,scope=${{ matrix.sdk.cache_scope }}-${{ matrix.sdk.preset }}
            type=gha,scope=${{ matrix.sdk.sdk_cache_scope }}-${{ matrix.sdk.preset }}
            type=gha,scope=${{ matrix.sdk.ccache_scope }}-${{ matrix.sdk.preset }}
          cache-to: type=gha,mode=max,scope=${{ matrix.sdk.cache_scope }}-${{ matrix.sdk.preset }}

      - name: Build baseline workload image
        id: baseline-build
        continue-on-error: true
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: sdk-baseline
          file: sdk-baseline/${{ matrix.sdk.dockerfile }}
          platforms: linux/amd64
          tags: ydb-app-baseline
          load: true
          build-args: |
            SLO_TARGET=${{ matrix.sdk.target }}
            SLO_BINARY=${{ matrix.sdk.binary }}
          cache-from: |
            type=gha,scope=${{ matrix.sdk.cache_scope }}-${{ matrix.sdk.preset }}-baseline
            type=gha,scope=${{ matrix.sdk.cache_scope }}-${{ matrix.sdk.preset }}
            type=gha,scope=${{ matrix.sdk.sdk_cache_scope }}-${{ matrix.sdk.preset }}
            type=gha,scope=${{ matrix.sdk.ccache_scope }}-${{ matrix.sdk.preset }}
          cache-to: type=gha,mode=max,scope=${{ matrix.sdk.cache_scope }}-${{ matrix.sdk.preset }}-baseline

      - name: Fall back to current image for baseline
        if: steps.baseline-build.outcome == 'failure'
        run: |
          echo "Baseline build failed; reusing current image as baseline."
          docker tag ydb-app-current ydb-app-baseline

      - name: Run SLO Tests
        uses: ydb-platform/ydb-slo-action/init@v2
        timeout-minutes: 30
        with:
          github_issue: ${{ github.event.pull_request.number }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workload_name: ${{ matrix.sdk.name }}
          workload_duration: "600"
          workload_current_ref: ${{ github.head_ref || github.ref_name }}
          workload_current_image: ydb-app-current
          workload_current_command: ${{ matrix.sdk.command }}
          workload_baseline_ref: ${{ steps.baseline.outputs.ref }}
          workload_baseline_image: ydb-app-baseline
          workload_baseline_command: ${{ matrix.sdk.command }}
          metrics_yaml_path: ${{ matrix.sdk.metrics_yaml_path }}
          fail_on_workload_error: "true"
