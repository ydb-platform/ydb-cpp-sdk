name: Publish release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach assets to (e.g. v1.2.3)"
        required: true
        type: string

concurrency:
  group: release-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-upload-debs:
    name: "Build .deb packages and attach to release (Ubuntu 24.04 / noble)"
    runs-on: ubuntu-24.04
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ inputs.tag }}"  >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Verify release tag matches SDK version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          sdk_version="$(sed -nE 's/.*YDB_SDK_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' src/version.h)"
          expected_tag="v${sdk_version}"

          if [[ -z "$sdk_version" ]]; then
            echo "::error::Could not extract YDB_SDK_VERSION from src/version.h"
            exit 1
          fi

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match SDK version $sdk_version (expected $expected_tag)"
            exit 1
          fi

      - name: Restore CPM and compiler caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/cpm
            .cache/ccache
          key: deb-ubuntu-24.04-${{ hashFiles('cmake/CPM.cmake', 'cmake/dependencies.cmake') }}-${{ github.run_id }}
          restore-keys: |
            deb-ubuntu-24.04-${{ hashFiles('cmake/CPM.cmake', 'cmake/dependencies.cmake') }}-

      - name: Build .deb packages with CPack
        shell: bash
        run: |
          ./scripts/build_cpack_deb_packages.sh artifacts

      - name: Test .deb packages
        shell: bash
        run: ./scripts/test_deb_packages.sh artifacts

      - name: List built artifacts
        shell: bash
        run: ls -la artifacts/

      - name: Upload .deb files to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" artifacts/*.deb --clobber

      - name: Upload .deb files as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages-${{ steps.tag.outputs.tag }}
          path: artifacts/*.deb
          if-no-files-found: warn
          retention-days: 30
