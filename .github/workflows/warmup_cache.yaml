name: Warm up cache

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  main:
    name: Warm CPM and ccache (${{ matrix.compiler }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [clang, gcc]
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-ubuntu-22.04-${{ hashFiles('cmake/CPM.cmake', 'cmake/dependencies.cmake') }}
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ubuntu-22.04-ccache-${{ matrix.compiler }}-${{ github.run_id }}
          restore-keys: |
            ubuntu-22.04-ccache-${{ matrix.compiler }}-
      - uses: ./.github/actions/prepare_vm
      - uses: ./.github/actions/build
        with:
          compiler: ${{ matrix.compiler }}

  coverage:
    name: Warm coverage compiler cache
    runs-on: ubuntu-22.04
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .cache/cpm
            ~/.ccache
          key: coverage-ubuntu-22.04-${{ hashFiles('cmake/CPM.cmake', 'cmake/dependencies.cmake') }}-${{ github.run_id }}
          restore-keys: |
            coverage-ubuntu-22.04-${{ hashFiles('cmake/CPM.cmake', 'cmake/dependencies.cmake') }}-
      - uses: ./.github/actions/prepare_vm
      - name: Configure and build coverage binaries
        run: |
          cmake --preset coverage-test-gcc
          cmake --build build --parallel

  deb-packages:
    name: Warm Ubuntu 24.04 DEB caches
    runs-on: ubuntu-24.04
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .cache/cpm
            .cache/ccache
          key: deb-ubuntu-24.04-${{ hashFiles('cmake/CPM.cmake', 'cmake/dependencies.cmake') }}-${{ github.run_id }}
          restore-keys: |
            deb-ubuntu-24.04-${{ hashFiles('cmake/CPM.cmake', 'cmake/dependencies.cmake') }}-
      - name: Build CPack DEBs
        run: ./scripts/build_cpack_deb_packages.sh build-deb/packages
