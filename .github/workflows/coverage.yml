name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-22.04
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
    permissions:
      contents: read
      id-token: write
    services:
      ydb:
        image: ydbplatform/local-ydb:24.4
        ports:
          - 2135:2135
          - 2136:2136
          - 8765:8765
        volumes:
          - /tmp/ydb_certs:/ydb_certs
        env:
          YDB_LOCAL_SURVIVE_RESTART: true
          YDB_USE_IN_MEMORY_PDISKS: true
          YDB_TABLE_ENABLE_PREPARED_DDL: true
        options: '-h localhost'
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        if: github.event.pull_request.head.sha != ''
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout
        uses: actions/checkout@v4
        if: github.event.pull_request.head.sha == ''

      - name: Restore CPM and compiler caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/cpm
            ~/.ccache
          key: coverage-ubuntu-22.04-${{ hashFiles('cmake/dependencies.cmake') }}-${{ github.run_id }}
          restore-keys: |
            coverage-ubuntu-22.04-${{ hashFiles('cmake/dependencies.cmake') }}-

      - name: Install dependencies
        uses: ./.github/actions/prepare_vm

      - name: Configure and build with coverage
        shell: bash
        run: |
          mkdir -p build
          cmake --preset coverage-test-gcc
          cmake --build build -j"$(nproc)"

      - name: Test
        shell: bash
        run: |
          set -euo pipefail

          IAM_REGEX='^(DriverAuth|TMetadataFixture|TJwtIamFixture|TOAuthIamFixture|OAuth_WithFacility)\.'
          FLAKY_REGEX='(ManyMessages|DiscoveryHang|DescribeHang)'
          EXCLUDE_REGEX="${IAM_REGEX}|${FLAKY_REGEX}"

          find build -type f \( -name '*.gcda' -o -name '*.gcov' \) -delete
          rm -rf build/coverage
          cmake -E remove_directory build/util/system/testing_out_stuff
          cmake -E make_directory build/util/system/testing_out_stuff

          ctest -j1 --preset coverage-all -E "${EXCLUDE_REGEX}" --output-on-failure

          IAM_CTEST_JOBS=1 ./.github/scripts/run_iam_integration_tests.sh

      - name: Generate coverage report
        uses: ./.github/actions/gcovr
        with:
          build-directory: build
          source-root: ${{ github.workspace }}
          gcov-executable: gcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: build/coverage/coverage-codecov.lcov
          disable_search: true
          plugins: noop
          flags: sdk
          name: ydb-cpp-sdk
          fail_ci_if_error: true
          verbose: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/
          retention-days: 14
