name: ydb.tech examples

on:
  pull_request:
  push:
    branches: [main, docs/topic-snippets]

concurrency:
  group: ydb-tech-examples-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  examples:
    name: Examples (ydb_tech)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
    services:
      ydb:
        image: ydbplatform/local-ydb:trunk
        ports: ["2136:2136", "8765:8765"]
        env:
          YDB_USE_IN_MEMORY_PDISKS: true
        options: '-h localhost'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-ubuntu-24.04-${{ hashFiles('cmake/CPM.cmake', 'cmake/dependencies.cmake') }}
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ubuntu-24.04-ccache-clang-ydb-tech-${{ github.sha }}
          restore-keys: ubuntu-24.04-ccache-clang-
      - uses: ./.github/actions/prepare_vm
      - name: Configure examples
        run: cmake --preset release-clang -D YDB_SDK_EXAMPLES=ON -D YDB_SDK_TESTS=OFF
      - name: Build examples
        run: cmake --build --preset default --target ydb_tech_examples
      - name: Save compilation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ubuntu-24.04-ccache-clang-ydb-tech-${{ github.sha }}
      - name: Run examples
        run: bash examples/ydb_tech/run.sh
