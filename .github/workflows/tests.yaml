name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - odbc-driver-feature
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build-and-unit:
    concurrency:
      group: build-and-unit-${{ github.ref }}-ubuntu-24.04-${{ matrix.compiler }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout PR
      uses: actions/checkout@v4
      if: github.event.pull_request.head.sha != ''
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Checkout
      uses: actions/checkout@v4
      if: github.event.pull_request.head.sha == ''
    - name: Restore CPM sources
      uses: actions/cache@v4
      with:
        path: .cache/cpm
        key: cpm-ubuntu-24.04-${{ hashFiles('cmake/CPM.cmake', 'cmake/dependencies.cmake') }}
    - name: Prepare ccache timestamp
      id: ccache_cache_timestamp
      shell: bash
      run: |
        echo "timestamp=$(date -u +%Y-%m-%d-%H-%M-%S)" >> "$GITHUB_OUTPUT"
    - name: Restore cache files
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ubuntu-24.04-ccache-${{ matrix.compiler }}-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
        restore-keys: |
          ubuntu-24.04-ccache-${{ matrix.compiler }}-
    - name: Install dependencies
      uses: ./.github/actions/prepare_vm
    - name: Build
      uses: ./.github/actions/build
      with:
        compiler: ${{ matrix.compiler }}
    - name: Test
      shell: bash
      run: |
        ctest -j$(nproc) --preset unit
    - name: Package integration build
      shell: bash
      run: |
        tar -C build \
          --exclude='*.o' \
          --exclude='*.obj' \
          --exclude='*.a' \
          --exclude='*.d' \
          --exclude='*.rsp' \
          --exclude='.ninja_deps' \
          --exclude='.ninja_log' \
          -czf "integration-build-${{ matrix.compiler }}.tar.gz" .
    - name: Upload integration build
      uses: actions/upload-artifact@v4
      with:
        name: integration-${{ matrix.compiler }}
        path: |
          integration-build-${{ matrix.compiler }}.tar.gz
        retention-days: 3

  integration:
    needs: build-and-unit
    concurrency:
      group: integration-${{ github.ref }}-${{ matrix.ydb-version }}-${{ matrix.compiler }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ydb-version: [24.1, 24.2, 24.3, 24.4, 25.1, trunk]
        compiler: [clang, gcc]
    services:
      ydb:
        image: ydbplatform/local-ydb:${{ matrix.ydb-version }}
        ports:
          - 2135:2135
          - 2136:2136
          - 8765:8765
        volumes:
          - /tmp/ydb_certs:/ydb_certs
        env:
          YDB_LOCAL_SURVIVE_RESTART: true
          YDB_USE_IN_MEMORY_PDISKS: true
          YDB_TABLE_ENABLE_PREPARED_DDL: true
        options: '-h localhost'
    steps:
    - name: Checkout PR
      uses: actions/checkout@v4
      if: github.event.pull_request.head.sha != ''
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Checkout
      uses: actions/checkout@v4
      if: github.event.pull_request.head.sha == ''
    - name: Install runtime dependencies
      uses: ./.github/actions/prepare_vm
      with:
        mode: runtime
    - name: Download integration build
      uses: actions/download-artifact@v4
      with:
        name: integration-${{ matrix.compiler }}
        path: .
    - name: Unpack integration build
      shell: bash
      run: |
        mkdir -p build
        tar -C build -xzf "integration-build-${{ matrix.compiler }}.tar.gz"
    - name: Test
      shell: bash
      run: |
        IAM_REGEX='^(DriverAuth|TMetadataFixture|TJwtIamFixture|TOAuthIamFixture|OAuth_WithFacility)\.'

        YDB_VERSION=${{ matrix.ydb-version }} ctest -j2 --preset integration \
          -E "${IAM_REGEX}" --output-on-failure

        case '${{ matrix.ydb-version }}' in
          25.1|trunk)
            ./.github/scripts/run_iam_integration_tests.sh
            ;;
        esac

  test-install:
    name: "Test CMake Install"
    concurrency:
      group: test-install-${{ github.ref }}-${{ matrix.compiler }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
    runs-on: ubuntu-24.04
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        if: github.event.pull_request.head.sha != ''
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout
        uses: actions/checkout@v4
        if: github.event.pull_request.head.sha == ''
      - name: Restore CPM sources
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-ubuntu-24.04-${{ hashFiles('cmake/CPM.cmake', 'cmake/dependencies.cmake') }}

      - name: Install dependencies
        uses: ./.github/actions/prepare_vm

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        shell: bash
        run: |
          echo "timestamp=$(date -u +%Y-%m-%d-%H-%M-%S)" >> "$GITHUB_OUTPUT"

      - name: Restore cache files
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ubuntu-24.04-ccache-${{ matrix.compiler }}-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            ubuntu-24.04-ccache-${{ matrix.compiler }}-

      - name: Build and Install SDK
        shell: bash
        run: |
          mkdir build
          cmake --preset release-${{ matrix.compiler }} -D YDB_SDK_INSTALL=On
          cmake --build --preset default
          cmake --install build --prefix ./_install

      - name: Verify Installation
        shell: bash
        run: |
          echo "Installation directory content for ${{ matrix.compiler }}:"
          ls -R ./_install
          if [ -z "$(ls -A ./_install)" ]; then
            echo "Error: Installation directory is empty!"
            exit 1
          fi

  deb-packages:
    name: "Test Debian Packages"
    concurrency:
      group: deb-packages-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        if: github.event.pull_request.head.sha != ''
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout
        uses: actions/checkout@v4
        if: github.event.pull_request.head.sha == ''
      - name: Restore CPM and compiler caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/cpm
            .cache/ccache
          key: deb-ubuntu-24.04-${{ hashFiles('cmake/CPM.cmake', 'cmake/dependencies.cmake') }}-${{ github.run_id }}
          restore-keys: |
            deb-ubuntu-24.04-${{ hashFiles('cmake/CPM.cmake', 'cmake/dependencies.cmake') }}-

      - name: Build CPack .deb packages
        shell: bash
        run: |
          ./scripts/build_cpack_deb_packages.sh build-deb/packages

      - name: Test CPack .deb packages
        shell: bash
        run: ./scripts/test_deb_packages.sh build-deb/packages
