schema_version: 1
ydb:
  image: ydbplatform/local-ydb:25.2.1@sha256:f65076231c056659f85d5399ae79e98ecc6278dc0f97dbbde3d2d0a1c79d5412
  endpoint: localhost:2136
  database: /local
consumers:
  - id: package-contract
    display_name: Debian package contract
    kind: package
    language: shell
    tier: smoke
    runtime_image: ubuntu:24.04@sha256:019e8eb29a85e74d64925745884f2ec79aa27e3feab36353d24656f4d6b89467
    runtime_version: [dpkg-query, -W, '-f=${Version}', base-files]
    runner: package-contract
    source: system
    expected:
      required: [package.clean_install, package.upgrade, package.remove, package.replacement]
  - id: isql
    display_name: unixODBC isql
    kind: smoke
    language: SQL
    tier: smoke
    runtime_image: ubuntu:24.04@sha256:019e8eb29a85e74d64925745884f2ec79aa27e3feab36353d24656f4d6b89467
    runtime_version: [odbcinst, -j]
    source: system
    modes: [dsn]
    tests:
      - id: isql.select_scalar
        name: isql executes a scalar query
        command: [isql, -b, -v, '{dsn}']
        stdin: "SELECT 42 AS value;\n"
        output_regex: '(^|[^0-9])42([^0-9]|$)'
    expected:
      required: [isql.select_scalar]
  - id: qt
    display_name: Qt 6 QODBC
    kind: smoke
    language: C++
    tier: smoke
    runtime_image: ubuntu:24.04@sha256:019e8eb29a85e74d64925745884f2ec79aa27e3feab36353d24656f4d6b89467
    runtime_version: [ydb_odbc_qt_test, --qt-version]
    source: system
    modes: [dsn, connection_string]
    tests:
      - id: qt.qodbc_dsn_select
        name: Qt QODBC connects through a DSN
        command: [ydb_odbc_qt_test, '{dsn}']
      - id: qt.qodbc_connection_string_select
        name: Qt QODBC connects through a connection string
        command: [ydb_odbc_qt_test, '{connection_string}']
    expected:
      required: [qt.qodbc_dsn_select, qt.qodbc_connection_string_select]
