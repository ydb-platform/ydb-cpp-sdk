metrics:
  - name: topic_e2e_latency_p50_ms
    unit: ms
    query: |
      1000 * max by(ref) (
        sdk_operation_latency_p50_seconds{operation_type="topic_e2e",operation_status="success"}
      )

  - name: topic_e2e_latency_p95_ms
    unit: ms
    query: |
      1000 * max by(ref) (
        sdk_operation_latency_p95_seconds{operation_type="topic_e2e",operation_status="success"}
      )

  - name: topic_e2e_latency_p99_ms
    unit: ms
    query: |
      1000 * max by(ref) (
        sdk_operation_latency_p99_seconds{operation_type="topic_e2e",operation_status="success"}
      )

  - name: topic_write_latency_p50_ms
    unit: ms
    query: |
      1000 * max by(ref) (
        sdk_operation_latency_p50_seconds{operation_type="write",operation_status="success"}
      )

  - name: topic_write_latency_p95_ms
    unit: ms
    query: |
      1000 * max by(ref) (
        sdk_operation_latency_p95_seconds{operation_type="write",operation_status="success"}
      )

  - name: topic_write_latency_p99_ms
    unit: ms
    query: |
      1000 * max by(ref) (
        sdk_operation_latency_p99_seconds{operation_type="write",operation_status="success"}
      )

  - name: topic_write_success_total
    unit: count
    query: |
      max by(ref) (
        sdk_operations_total{operation_type="write",operation_status="success"}
      )

  - name: topic_write_error_total
    unit: count
    query: |
      max by(ref) (
        sdk_operations_total{operation_type="write",operation_status="error"}
      )

  - name: topic_write_retry_attempts_total
    unit: count
    query: |
      max by(ref) (
        sdk_retry_attempts_total{operation_type="write"}
      )
